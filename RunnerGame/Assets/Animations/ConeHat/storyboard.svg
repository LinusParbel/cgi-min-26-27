<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700" role="img" aria-labelledby="title desc"><title id="title">Cone hat road cinematic storyboard, 28 seconds</title><desc id="desc">Eleven shots: approach, pickup, swagger, late officer reveal, shout, guilty pause, removal, nervous walk, run, mount and accelerating gameplay handoff. Road-only schematic; not game footage.</desc><style>text{font-family:Arial,sans-serif;fill:#eee7d5}.shot{font-size:21px;font-weight:bold}.time{font-size:17px;fill:#e7b466}.caption{font-size:17px}.small{font-size:15px;fill:#bbcec2}.cue{font-size:24px;font-weight:bold;fill:#e7b466}</style><rect width="1400" height="1700" fill="#101d17"/><text x="30" y="44" font-size="30" font-weight="bold">CONE HAT / ROAD CINEMATIC</text><text x="30" y="79" font-size="18">28-second working cut · late reveal · natural contacts · walking before running · maps deferred</text>
<g transform="translate(30 110)"><title>S01 Casual approach</title><rect width="655" height="238" rx="8" fill="#1d2a27" stroke="#43534b"/><text x="18" y="29" class="shot">S01 · Casual approach</text><text x="637" y="29" text-anchor="end" class="time">0–4 s</text><g transform="translate(0 5)"><path d="M24,171 H626" stroke="#5c6a63"/><path d="M30,60 h95 v111 m20,-80 h52 v80 M500,45 h80 v126" stroke="#34443d" fill="none"/><g transform="translate(430 168)" stroke="#a9cfa6" stroke-width="4" fill="none"><circle r="9"/><circle cx="82" r="9"/><path d="M0,-5 H60 L78,-65 H58 M78,-65 L82,-8"/></g><g transform="translate(210 170) scale(1)" fill="none" stroke="#e4ddc9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cy="-77" r="10" fill="#e4ddc9"/><path d="M0,-60 v37 m0,-27 l-20,20 m20,-20 l20,20 m-20,7 l-16,25 m16,-25 l16,25"/></g><g transform="translate(307 170) scale(0.85)"><path d="M-19,0 L0,-46 19,0Z" fill="#f1974e"/><path d="M-12,-17 H12 L15,-10 H-15Z" fill="#eee3c8"/><path d="M-25,0 H25" stroke="#cd6c36" stroke-width="6"/></g><path d="M172,193 h88 l-10,-6 m10,6 l-10,6" stroke="#e7b466" stroke-width="2.5" fill="none"/></g><text x="18" y="226" class="caption">Rider walks; officer stays outside the shot.</text></g>
<g transform="translate(715 110)"><title>S02 Lift the cone</title><rect width="655" height="238" rx="8" fill="#1d2a27" stroke="#43534b"/><text x="18" y="29" class="shot">S02 · Lift the cone</text><text x="637" y="29" text-anchor="end" class="time">4–7 s</text><g transform="translate(0 5)"><path d="M24,171 H626" stroke="#5c6a63"/><path d="M30,60 h95 v111 m20,-80 h52 v80 M500,45 h80 v126" stroke="#34443d" fill="none"/><g transform="translate(430 168)" stroke="#a9cfa6" stroke-width="4" fill="none"><circle r="9"/><circle cx="82" r="9"/><path d="M0,-5 H60 L78,-65 H58 M78,-65 L82,-8"/></g><g transform="translate(210 170) scale(1)" fill="none" stroke="#e4ddc9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cy="-77" r="10" fill="#e4ddc9"/><path d="M0,-60 v37 m0,-27 l-20,-20 9,-27 m11,47 l20,-20 -9,-27 m-11,57 l-16,25 m16,-25 l16,25"/></g><g transform="translate(226 71) scale(0.85)"><path d="M-19,0 L0,-46 19,0Z" fill="#f1974e"/><path d="M-12,-17 H12 L15,-10 H-15Z" fill="#eee3c8"/><path d="M-25,0 H25" stroke="#cd6c36" stroke-width="6"/></g></g><text x="18" y="226" class="caption">Crouch, grip, clear the face, then put it on.</text></g>
<g transform="translate(30 365)"><title>S03 Proud swagger</title><rect width="655" height="238" rx="8" fill="#1d2a27" stroke="#43534b"/><text x="18" y="29" class="shot">S03 · Proud swagger</text><text x="637" y="29" text-anchor="end" class="time">7–9 s</text><g transform="translate(0 5)"><path d="M24,171 H626" stroke="#5c6a63"/><path d="M30,60 h95 v111 m20,-80 h52 v80 M500,45 h80 v126" stroke="#34443d" fill="none"/><g transform="translate(430 168)" stroke="#a9cfa6" stroke-width="4" fill="none"><circle r="9"/><circle cx="82" r="9"/><path d="M0,-5 H60 L78,-65 H58 M78,-65 L82,-8"/></g><g transform="translate(210 170) scale(1)" fill="none" stroke="#e4ddc9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cy="-77" r="10" fill="#e4ddc9"/><path d="M0,-60 v37 m0,-27 l-20,20 m20,-20 l20,20 m-20,7 l-16,25 m16,-25 l16,25"/></g><g transform="translate(210 92) scale(0.85)"><path d="M-19,0 L0,-46 19,0Z" fill="#f1974e"/><path d="M-12,-17 H12 L15,-10 H-15Z" fill="#eee3c8"/><path d="M-25,0 H25" stroke="#cd6c36" stroke-width="6"/></g><path d="M172,193 h88 l-10,-6 m10,6 l-10,6" stroke="#e7b466" stroke-width="2.5" fill="none"/></g><text x="18" y="226" class="caption">Cone follows the head; hands release naturally.</text></g>
<g transform="translate(715 365)"><title>S04 Late officer reveal</title><rect width="655" height="238" rx="8" fill="#1d2a27" stroke="#43534b"/><text x="18" y="29" class="shot">S04 · Late officer reveal</text><text x="637" y="29" text-anchor="end" class="time">9–11 s</text><g transform="translate(0 5)"><path d="M24,171 H626" stroke="#5c6a63"/><path d="M30,60 h95 v111 m20,-80 h52 v80 M500,45 h80 v126" stroke="#34443d" fill="none"/><g transform="translate(430 168)" stroke="#a9cfa6" stroke-width="4" fill="none"><circle r="9"/><circle cx="82" r="9"/><path d="M0,-5 H60 L78,-65 H58 M78,-65 L82,-8"/></g><g transform="translate(210 170) scale(1)" fill="none" stroke="#e4ddc9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cy="-77" r="10" fill="#e4ddc9"/><path d="M0,-60 v37 m0,-27 l-20,20 m20,-20 l20,20 m-20,7 l-16,25 m16,-25 l16,25"/></g><g transform="translate(210 92) scale(0.85)"><path d="M-19,0 L0,-46 19,0Z" fill="#f1974e"/><path d="M-12,-17 H12 L15,-10 H-15Z" fill="#eee3c8"/><path d="M-25,0 H25" stroke="#cd6c36" stroke-width="6"/></g><g transform="translate(552 170) scale(0.53)" fill="none" stroke="#7ba7c5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cy="-77" r="10" fill="#7ba7c5"/><path d="M0,-60 v37 m0,-27 l-20,20 m20,-20 l20,20 m-20,7 l-16,25 m16,-25 l16,25"/></g><text x="482" y="81" class="small">~16 m away</text></g><text x="18" y="226" class="caption">Camera reveals the patrol about 16 metres away.</text></g>
<g transform="translate(30 620)"><title>S05 The officer calls</title><rect width="655" height="238" rx="8" fill="#1d2a27" stroke="#43534b"/><text x="18" y="29" class="shot">S05 · The officer calls</text><text x="637" y="29" text-anchor="end" class="time">11–12.3 s</text><g transform="translate(0 5)"><path d="M24,171 H626" stroke="#5c6a63"/><path d="M30,60 h95 v111 m20,-80 h52 v80 M500,45 h80 v126" stroke="#34443d" fill="none"/><g transform="translate(320 168) scale(1.15)" fill="none" stroke="#7ba7c5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cy="-77" r="10" fill="#7ba7c5"/><path d="M0,-60 v37 m0,-27 l-20,-12 -5,-24 m25,36 l20,20 m-20,7 l-16,25 m16,-25 l16,25"/></g><text x="363" y="82" class="cue">HEY!</text></g><text x="18" y="226" class="caption">Hand rises; “Hey! Stehen bleiben!”</text></g>
<g transform="translate(715 620)"><title>S06 Awkward reaction</title><rect width="655" height="238" rx="8" fill="#1d2a27" stroke="#43534b"/><text x="18" y="29" class="shot">S06 · Awkward reaction</text><text x="637" y="29" text-anchor="end" class="time">12.3–15 s</text><g transform="translate(0 5)"><path d="M24,171 H626" stroke="#5c6a63"/><path d="M30,60 h95 v111 m20,-80 h52 v80 M500,45 h80 v126" stroke="#34443d" fill="none"/><g transform="translate(430 168)" stroke="#a9cfa6" stroke-width="4" fill="none"><circle r="9"/><circle cx="82" r="9"/><path d="M0,-5 H60 L78,-65 H58 M78,-65 L82,-8"/></g><g transform="translate(210 170) scale(1)" fill="none" stroke="#e4ddc9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cy="-77" r="10" fill="#e4ddc9"/><path d="M0,-60 v37 m0,-27 l-20,20 m20,-20 l20,20 m-20,7 l-16,25 m16,-25 l16,25"/></g><g transform="translate(210 92) scale(0.85)"><path d="M-19,0 L0,-46 19,0Z" fill="#f1974e"/><path d="M-12,-17 H12 L15,-10 H-15Z" fill="#eee3c8"/><path d="M-25,0 H25" stroke="#cd6c36" stroke-width="6"/></g><g transform="translate(552 170) scale(0.53)" fill="none" stroke="#7ba7c5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cy="-77" r="10" fill="#7ba7c5"/><path d="M0,-60 v37 m0,-27 l-20,20 m20,-20 l20,20 m-20,7 l-16,25 m16,-25 l16,25"/></g><text x="300" y="86" class="cue">…</text></g><text x="18" y="226" class="caption">Look back, freeze, then hold the guilty silence.</text></g>
