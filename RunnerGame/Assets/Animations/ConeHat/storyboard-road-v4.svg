<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
  <title id="title">Cone hat road cinematic storyboard, 30 seconds</title>
  <desc id="desc">Eleven shots: approach, cone gag, late officer reveal, calls and guilty pause, walk, run, mount and gameplay handoff.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#ece6d5}.bg{fill:#101d17}.card{fill:#1d2a27;stroke:#43534b;stroke-width:2}.time{fill:#e7b466;font-weight:bold}.small{fill:#bbcec2}.road{stroke:#68756e;stroke-width:3}.rider{stroke:#e4ddc9;stroke-width:6;stroke-linecap:round;fill:none}.officer{stroke:#a9cfa6;stroke-width:5;stroke-linecap:round;fill:none}.cone{fill:#f1974e;stroke:#d66d38;stroke-width:3}</style>
  <rect class="bg" width="1200" height="1050"/>
  <text x="32" y="44" font-size="30" font-weight="bold">CONE HAT / ROAD CINEMATIC</text>
  <text x="32" y="76" font-size="18" class="small">30-second working cut · late reveal · repeated calls · grounded steps · maps deferred</text>
  <g transform="translate(30 100)">
    <g transform="translate(0 0)"><rect class="card" width="555" height="135" rx="8"/><text x="16" y="27" font-size="19" font-weight="bold">S01 · Casual approach</text><text class="time" x="520" y="27" text-anchor="end">0–4 s</text><path class="road" d="M20 92H535"/><circle class="rider" cx="190" cy="60" r="10"/><path class="rider" d="M190 70v25m0-17-13 13m13-13 13 13"/><path class="cone" d="M280 92l14-36 14 36z"/><text class="small" x="16" y="122" font-size="14">Natural concrete footsteps; officer remains out of frame.</text></g>
    <g transform="translate(585 0)"><rect class="card" width="555" height="135" rx="8"/><text x="16" y="27" font-size="19" font-weight="bold">S02 · Lift and wear</text><text class="time" x="520" y="27" text-anchor="end">4–7 s</text><path class="road" d="M20 92H535"/><circle class="rider" cx="210" cy="60" r="10"/><path class="rider" d="M210 70v25m0-17-14-13m14 13 14-13"/><path class="cone" d="M196 39l14-30 14 30z"/><text class="small" x="16" y="122" font-size="14">Show the grip, face clearance and settled cone hat.</text></g>
    <g transform="translate(0 150)"><rect class="card" width="555" height="135" rx="8"/><text x="16" y="27" font-size="19" font-weight="bold">S03 · Proud swagger</text><text class="time" x="520" y="27" text-anchor="end">7–9 s</text><path class="road" d="M20 92H535"/><circle class="rider" cx="245" cy="60" r="10"/><path class="rider" d="M245 70v25m0-17-13 13m13-13 13 13"/><path class="cone" d="M231 39l14-30 14 30z"/><text class="small" x="16" y="122" font-size="14">Hands relax; cone follows the head on each step.</text></g>
    <g transform="translate(585 150)"><rect class="card" width="555" height="135" rx="8"/><text x="16" y="27" font-size="19" font-weight="bold">S04 · Late reveal</text><text class="time" x="520" y="27" text-anchor="end">9–11 s</text><path class="road" d="M20 92H535"/><circle class="rider" cx="190" cy="60" r="10"/><path class="rider" d="M190 70v25m0-17-13 13m13-13 13 13"/><path class="officer" d="M430 68v26m0-17-11 11m11-11 11 11"/><text class="small" x="16" y="122" font-size="14">Camera finds the officer about 16 metres down the road.</text></g>
    <g transform="translate(0 300)"><rect class="card" width="555" height="135" rx="8"/><text x="16" y="27" font-size="19" font-weight="bold">S05 · The first call</text><text class="time" x="520" y="27" text-anchor="end">11–12.3 s</text><path class="road" d="M20 92H535"/><circle class="rider" cx="260" cy="60" r="10"/><path class="rider" d="M260 70v25m0-17-12 5m12-5 12 5"/><path class="cone" d="M246 39l14-30 14 30z"/><path class="officer" d="M430 68v26m0-17-11-11m11 11 11-11"/><text class="small" x="16" y="122" font-size="14">Officer points and calls “Hey!” then “Stehen bleiben!”</text></g>
    <g transform="translate(585 300)"><rect class="card" width="555" height="135" rx="8"/><text x="16" y="27" font-size="19" font-weight="bold">S06 · Awkward reaction</text><text class="time" x="520" y="27" text-anchor="end">12.3–15 s</text><path class="road" d="M20 92H535"/><circle class="rider" cx="260" cy="60" r="10"/><path class="rider" d="M260 70v25m0-17-12 5m12-5 12 5"/><path class="cone" d="M246 39l14-30 14 30z"/><text class="small" x="16" y="122" font-size="14">Look back; freeze; let the silence make the joke.</text></g>
    <g transform="translate(0 450)"><rect class="card" width="555" height="135" rx="8"/><text x="16" y="27" font-size="19" font-weight="bold">S07 · Slow removal</text><text class="time" x="520" y="27" text-anchor="end">15–17 s</text><path class="road" d="M20 92H535"/><circle class="rider" cx="260" cy="60" r="10"/><path class="rider" d="M260 70v25m0-17-12-12m12 12 12-12"/><path class="cone" d="M320 73l14-34 14 34z"/><text class="small" x="16" y="122" font-size="14">Remove gently; cone lands and rocks beside the path.</text></g>
    <g transform="translate(585 450)"><rect class="card" width="555" height="135" rx="8"/><text x="16" y="27" font-size="19" font-weight="bold">S08 · Pretend nothing happened</text><text class="time" x="520" y="27" text-anchor="end">17–20 s</text><path class="road" d="M20 92H535"/><circle class="rider" cx="220" cy="60" r="10"/><path class="rider" d="M220 70v25m0-17-13 13m13-13 13 13"/><path class="officer" d="M420 68v26m0-17-11 11m11-11 11 11"/><text class="small" x="16" y="122" font-size="14">Both walk; officer repeats the order as rider strolls away.</text></g>
    <g transform="translate(0 600)"><rect class="card" width="555" height="135" rx="8"/><text x="16" y="27" font-size="19" font-weight="bold">S09 · Run after them</text><text class="time" x="520" y="27" text-anchor="end">20–24 s</text><path class="road" d="M20 92H535"/><circle class="rider" cx="190" cy="60" r="10"/><path class="rider" d="M190 70l8 16m-8-16-14 10m22 6 16 5m-16-5-12 14"/><path class="officer" d="M430 68l7 17m-7-17-12 10m19 7 15 5m-15-5-12 14"/><text class="small" x="16" y="122" font-size="14">Closer officer run, then wide two-shot; he calls again.</text></g>
    <g transform="translate(585 600)"><rect class="card" width="555" height="135" rx="8"/><text x="16" y="27" font-size="19" font-weight="bold">S10 · Mount and fumble</text><text class="time" x="520" y="27" text-anchor="end">24–27 s</text><path class="road" d="M20 92H535"/><circle class="rider" cx="250" cy="60" r="10"/><path class="rider" d="M250 70v20m0-13 22-8m-22 8 14 13"/><path class="officer" d="M420 68v26m0-17-11 11m11-11 11 11"/><text class="small" x="16" y="122" font-size="14">Foot onto deck, handlebar wobble, stand clack, late beep.</text></g>
    <g transform="translate(0 750)"><rect class="card" width="555" height="135" rx="8"/><text x="16" y="27" font-size="19" font-weight="bold">S11 · Takeoff to gameplay</text><text class="time" x="520" y="27" text-anchor="end">27–30 s</text><path class="road" d="M20 92H535"/><circle class="rider" cx="250" cy="60" r="10"/><path class="rider" d="M250 70v22m0-15-20 3m20-3 20 3m-20 12-12 13m12-13 15 13"/><path class="road" d="M210 93h85l18-28h-30m20 0h20"/><text class="small" x="16" y="122" font-size="14">Accelerate smoothly to 12 m/s; settle into the play camera.</text></g>
  </g>
</svg>
