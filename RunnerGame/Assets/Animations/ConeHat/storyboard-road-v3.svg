<!-- Historical storyboard; current cut: storyboard-road-v4.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">Cone hat road cinematic storyboard, 30 seconds</title>
  <desc id="desc">Eleven beats: approach, cone gag, distant officer reveal, repeated calls, guilty pause, walk, run, scooter mount and gameplay handoff. Road only.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#ece6d5}.bg{fill:#101d17}.card{fill:#1d2a27;stroke:#43534b;stroke-width:2}.time{fill:#e7b466;font-weight:bold}.small{fill:#bbcec2}.road{stroke:#68756e;stroke-width:3}.rider{stroke:#e4ddc9;stroke-width:6;stroke-linecap:round;fill:none}.officer{stroke:#a9cfa6;stroke-width:5;stroke-linecap:round;fill:none}.cone{fill:#f1974e;stroke:#d66d38;stroke-width:3}
  </style>
  <rect class="bg" width="1200" height="940"/>
  <text x="32" y="44" font-size="30" font-weight="bold">CONE HAT / ROAD CINEMATIC</text>
  <text x="32" y="76" font-size="18" class="small">30-second working cut · late reveal · escalating calls · walking before running · maps deferred</text>
  <g transform="translate(30 104)">
    <g transform="translate(0 0)"><rect class="card" width="555" height="145" rx="8"/><text x="16" y="28" font-size="19" font-weight="bold">S01 · Casual approach</text><text class="time" x="520" y="28" text-anchor="end">0–4 s</text><path class="road" d="M20 105H535"/><circle class="rider" cx="190" cy="65" r="11"/><path class="rider" d="M190 78v35m0-21-17 17m17-17 17 17"/><path class="cone" d="M280 105l16-42 16 42z"/><text class="small" x="16" y="134" font-size="14">Approach with grounded footfalls; officer stays out of frame.</text></g>
    <g transform="translate(585 0)"><rect class="card" width="555" height="145" rx="8"/><text x="16" y="28" font-size="19" font-weight="bold">S02 · Lift and wear</text><text class="time" x="520" y="28" text-anchor="end">4–7 s</text><path class="road" d="M20 105H535"/><circle class="rider" cx="210" cy="65" r="11"/><path class="rider" d="M210 78v35m0-21-18-15m18 15 18-15"/><path class="cone" d="M195 40l15-32 15 32z"/><text class="small" x="16" y="134" font-size="14">Show the grip, face clearance, and settled cone hat.</text></g>
    <g transform="translate(0 165)"><rect class="card" width="555" height="145" rx="8"/><text x="16" y="28" font-size="19" font-weight="bold">S03 · Proud swagger</text><text class="time" x="520" y="28" text-anchor="end">7–9 s</text><path class="road" d="M20 105H535"/><circle class="rider" cx="245" cy="65" r="11"/><path class="rider" d="M245 78v35m0-21-16 17m16-17 16 17"/><path class="cone" d="M230 42l15-32 15 32z"/><text class="small" x="16" y="134" font-size="14">Hands relax; the cone follows the head through each step.</text></g>
    <g transform="translate(585 165)"><rect class="card" width="555" height="145" rx="8"/><text x="16" y="28" font-size="19" font-weight="bold">S04 · Late reveal</text><text class="time" x="520" y="28" text-anchor="end">9–11 s</text><path class="road" d="M20 105H535"/><circle class="rider" cx="190" cy="65" r="11"/><path class="rider" d="M190 78v35m0-21-16 17m16-17 16 17"/><path class="officer" d="M430 75v30m0-19-13 13m13-13 13 13"/><text class="small" x="16" y="134" font-size="14">Camera finds the officer about 16 metres down the road.</text></g>
    <g transform="translate(0 330)"><rect class="card" width="555" height="145" rx="8"/><text x="16" y="28" font-size="19" font-weight="bold">S05 · Call and guilty look</text><text class="time" x="520" y="28" text-anchor="end">11–15 s</text><path class="road" d="M20 105H535"/><circle class="rider" cx="260" cy="65" r="11"/><path class="rider" d="M260 78v35m0-21-16 5m16-5 16 5"/><path class="cone" d="M245 42l15-32 15 32z"/><path class="officer" d="M430 75v30m0-19-13-13m13 13 13-13"/><text class="small" x="16" y="134" font-size="14">“Hey!” then “Stehen bleiben!”; hold the awkward silence.</text></g>
    <g transform="translate(585 330)"><rect class="card" width="555" height="145" rx="8"/><text x="16" y="28" font-size="19" font-weight="bold">S06 · Slow removal</text><text class="time" x="520" y="28" text-anchor="end">15–17 s</text><path class="road" d="M20 105H535"/><circle class="rider" cx="260" cy="65" r="11"/><path class="rider" d="M260 78v35m0-21-14-13m14 13 14-13"/><path class="cone" d="M320 82l15-32 15 32z"/><text class="small" x="16" y="134" font-size="14">Remove gently; plastic lands and rocks beside the escape path.</text></g>
    <g transform="translate(0 495)"><rect class="card" width="555" height="145" rx="8"/><text x="16" y="28" font-size="19" font-weight="bold">S07 · Pretend nothing happened</text><text class="time" x="520" y="28" text-anchor="end">17–20 s</text><path class="road" d="M20 105H535"/><circle class="rider" cx="220" cy="65" r="11"/><path class="rider" d="M220 78v35m0-21-16 17m16-17 16 17"/><path class="officer" d="M420 75v30m0-19-13 13m13-13 13 13"/><text class="small" x="16" y="134" font-size="14">Both walk; officer repeats the order as rider keeps going.</text></g>
    <g transform="translate(585 495)"><rect class="card" width="555" height="145" rx="8"/><text x="16" y="28" font-size="19" font-weight="bold">S08 · Run after them</text><text class="time" x="520" y="28" text-anchor="end">20–24 s</text><path class="road" d="M20 105H535"/><circle class="rider" cx="190" cy="65" r="11"/><path class="rider" d="M190 78l8 20m-8-20-16 11m24 9 18 6m-18-6-13 17"/><path class="officer" d="M430 75l8 20m-8-20-14 11m22 9 17 6m-17-6-13 17"/><text class="small" x="16" y="134" font-size="14">Closer officer running shot, then wider two-shot; “Hey!” again.</text></g>
    <g transform="translate(0 660)"><rect class="card" width="555" height="145" rx="8"/><text x="16" y="28" font-size="19" font-weight="bold">S09 · Scooter mount</text><text class="time" x="520" y="28" text-anchor="end">24–27 s</text><path class="road" d="M20 105H535"/><circle class="rider" cx="250" cy="60" r="11"/><path class="rider" d="M250 73v22m0-13 23-10m-23 10 15 15"/><path class="officer" d="M420 80v25m0-14-11 11m11-11 11 11"/><text class="small" x="16" y="134" font-size="14">Foot onto deck, handlebar fumble, kickstand clack, late beep.</text></g>
    <g transform="translate(585 660)"><rect class="card" width="555" height="145" rx="8"/><text x="16" y="28" font-size="19" font-weight="bold">S10 · Takeoff to gameplay</text><text class="time" x="520" y="28" text-anchor="end">27–30 s</text><path class="road" d="M20 105H535"/><circle class="rider" cx="250" cy="65" r="11"/><path class="rider" d="M250 78v22m0-14-22 3m22-3 20 3m-20 11-13 14m13-14 16 14"/><path class="road" d="M210 103h85l18-30h-30m20 0h20"/><text class="small" x="16" y="134" font-size="14">Accelerate smoothly to 12 m/s; settle into gameplay camera.</text></g>
  </g>
</svg>
