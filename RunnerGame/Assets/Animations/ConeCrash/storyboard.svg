<text class="note" x="14" y="266">Camera moves down; run, plant, jump.</text></g>
<g transform="translate(20 390)"><rect width="375" height="285" rx="8" fill="#283e51"/><text class="label" x="14" y="27">4.1-7.3 s / Airborne interception</text>
