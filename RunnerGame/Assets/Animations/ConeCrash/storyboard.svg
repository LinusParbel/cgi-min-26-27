<text class="note" x="14" y="266">Wheel catches cone; flip flows into launch.</text></g>
<g transform="translate(415 85)"><rect width="375" height="285" rx="8" fill="#283e51"/><text class="label" x="14" y="27">1.4-2.05 s / Follow the launched rider</text>
<circle cx="190" cy="98" r="9" fill="#65c6ba"/><path d="M190 108v40m0-27l-23 14m23-14l23 14m-23 13l-16 27m16-27l16 27" stroke="#65c6ba" stroke-width="6" fill="none"/><path class="arrow" d="M240 180L240 65"/>
<text class="note" x="14" y="266">Keep rising; no hovering.</text></g>
<g transform="translate(810 85)"><rect width="375" height="285" rx="8" fill="#283e51"/><text class="label" x="14" y="27">2.05-4.1 s / Officer run-up</text>
