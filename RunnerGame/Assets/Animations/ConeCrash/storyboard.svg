<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#f3d184"/></marker></defs><rect width="1200" height="710" fill="#15212a"/><style>text{font-family:Arial,sans-serif;fill:#edf4fa}.title{font-size:24px}.label{font-size:18px}.note{font-size:13px}.arrow{stroke:#f3d184;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><text class="title" x="22" y="35">SPECIAL DELIVERY - continuous pursuit revision / v12</text><text class="note" x="22" y="60">All flight keeps moving. Camera transitions are continuous. Renderer footage establishes final acting.</text>
<g transform="translate(20 85)"><rect width="375" height="285" rx="8" fill="#283e51"/><text class="label" x="14" y="27">0-1.4 s / Impact and release</text>
