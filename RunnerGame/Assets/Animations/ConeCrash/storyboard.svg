<text class="note" x="14" y="266">Lower arc approaches rider from below.</text></g>
<g transform="translate(415 390)"><rect width="375" height="285" rx="8" fill="#283e51"/><text class="label" x="14" y="27">7.3-7.7 s / Passing ticket slap</text>
<circle cx="155" cy="90" r="9" fill="#65c6ba"/><path d="M155 100v40m0-27l-23 14m23-14l23 14m-23 13l-16 27m16-27l16 27" stroke="#65c6ba" stroke-width="6" fill="none"/><circle cx="222" cy="110" r="9" fill="#b3c9e0"/><path d="M222 120v40m0-27l-23 14m23-14l23 14m-23 13l-16 27m16-27l16 27" stroke="#b3c9e0" stroke-width="6" fill="none"/><rect x="155" y="113" width="18" height="25" fill="#f3e5ac"/><path d="M155 117h18" stroke="#c44a42" stroke-width="4"/><path class="arrow" d="M110 190L110 80"/><path class="arrow" d="M268 210L268 100"/>
<text class="note" x="14" y="266">Brief moving contact; paper stays.</text></g>
<g transform="translate(810 390)"><rect width="375" height="285" rx="8" fill="#283e51"/><text class="label" x="14" y="27">7.7-17 s / Fall away and follow rider</text>
<circle cx="160" cy="65" r="9" fill="#65c6ba"/><path d="M160 75v40m0-27l-23 14m23-14l23 14m-23 13l-16 27m16-27l16 27" stroke="#65c6ba" stroke-width="6" fill="none"/><circle cx="255" cy="160" r="9" fill="#b3c9e0"/><path d="M255 170v40m0-27l-23 14m23-14l23 14m-23 13l-16 27m16-27l16 27" stroke="#b3c9e0" stroke-width="6" fill="none"/><path class="arrow" d="M110 190L110 60"/><path class="arrow" d="M300 140L300 230"/><text class="note" x="35" y="225">Camera follows upward</text>
<text class="note" x="14" y="266">Officer drops; camera follows rider to twinkle.</text></g>
